<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Efficiency Tracking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --leoni-blue-light: #00B2FF;
        --leoni-blue-dark: #002857;
        --leoni-orange: #FF7514;
        --surface: #ffffff;
      }

      body {
        font-family: "Plus Jakarta Sans", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        background:
          radial-gradient(circle at 20% 10%, rgba(0, 178, 255, 0.2), transparent 35%),
          radial-gradient(circle at 82% 16%, rgba(255, 117, 20, 0.2), transparent 30%),
          linear-gradient(160deg, #08284e 0%, #0b2f5d 45%, #0f3768 100%);
        color: var(--leoni-blue-dark);
      }

      .shell { max-width: none; width: 100%; margin: 0 auto; padding: 22px; }
      .card {
        background: var(--surface);
        border: 1px solid rgba(0, 40, 87, 0.06);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 14px 30px rgba(0, 40, 87, 0.1);
        margin-bottom: 16px;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr 120px 1fr;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .brand {
        font-size: clamp(1.4rem, 2.6vw, 2.2rem);
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .brand-logo {
        height: 68px;
        width: auto;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
      }

      .brand-opes {
        justify-self: start;
        color: var(--leoni-blue-dark);
      }

      .brand-leoni {
        justify-self: end;
        color: var(--leoni-blue-dark);
      }

      .brand-leoni .brand-logo {
        height: 62px;
        filter: brightness(0) invert(1);
      }

      .brand-opes .brand-logo {
        height: 74px;
      }

      .topbar-center {
        min-height: 78px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .robot-wrap {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        border: 2px solid rgba(255, 255, 255, 0.45);
        background: linear-gradient(180deg, #d6ecff, #9ac3e6);
        display: grid;
        place-items: center;
        color: #0a3a6a;
        animation: robotFloat 2.2s ease-in-out infinite;
        box-shadow: 0 12px 20px rgba(6, 26, 52, 0.25);
      }

      .robot-wrap i {
        font-size: 2rem;
      }

      .welcome-bubble {
        background: #f7f8fa;
        color: #103c70;
        border-radius: 16px;
        border: 1px solid rgba(16, 60, 112, 0.15);
        padding: 10px 16px;
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
      }

      .welcome-name {
        text-transform: lowercase;
      }

      .welcome-bubble i {
        color: #ff7a1a;
      }

      @keyframes robotFloat {
        0% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0); }
      }

      .auth-strip {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 16px;
      }

      .welcome-line {
        color: #e8f1ff;
        text-align: center;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        margin: 4px 0 14px;
      }

      #statusBox {
        background: transparent;
        border: none;
        box-shadow: none;
        margin: 0;
        padding: 0;
      }

      #loginView {
        max-width: 560px;
        margin: 0 auto;
        border-radius: 18px;
        padding: 16px 20px 18px;
        background: linear-gradient(180deg, #f8f9fb, #f4f7fc);
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 18px 36px rgba(4, 20, 41, 0.28);
      }

      #loginView::before {
        content: "";
        position: absolute;
        left: -30px;
        right: -30px;
        bottom: -30px;
        height: 70%;
        background: linear-gradient(to top, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.72)), url("../Images/image 5 (1).png") center bottom / cover no-repeat;
        pointer-events: none;
      }

      .login-head,
      #loginForm,
      .login-foot {
        position: relative;
        z-index: 1;
      }

      .login-head {
        margin: 0 0 10px;
        font-size: 2rem;
        text-align: left;
        color: #103c70;
        font-weight: 800;
      }

      #loginForm label {
        color: #103c70;
        font-weight: 700;
      }

      .topbar button, .card button, .card input, .card select { font: inherit; }
      .topbar button, .card button {
        background: linear-gradient(90deg, var(--leoni-blue-dark), var(--leoni-blue-light));
        color: white;
        border: none;
        border-radius: 8px;
        padding: 9px 12px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      }

      .topbar button:hover, .card button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 18px rgba(7, 42, 82, 0.22);
      }

      .topbar button:active, .card button:active {
        transform: translateY(0);
      }

      input, select {
        display: block;
        width: 100%;
        margin: 8px 0 12px;
        padding: 11px 12px;
        border-radius: 8px;
        border: 2px solid #ff7a1a;
        background: #ffffff;
        box-sizing: border-box;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus,
      select:focus,
      .entry-input:focus,
      .entry-select:focus,
      .app-select:focus {
        outline: none;
        border-color: #21b4f2;
        box-shadow: 0 0 0 3px rgba(33, 180, 242, 0.2);
      }

      #loginForm button[type="submit"] {
        width: 100%;
        margin-top: 4px;
        border-radius: 9px;
        font-size: 1.05rem;
        padding: 11px;
        background: linear-gradient(90deg, #1899d3, #21b4f2);
      }

      #loginForm button[type="submit"] i {
        margin-right: 8px;
      }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      .pill {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(0, 178, 255, 0.16);
        color: var(--leoni-blue-dark);
        border: 1px solid rgba(0, 40, 87, 0.18);
        margin-right: 8px;
      }
      .muted { color: #325072; font-size: 0.95rem; }
      .hidden { display: none; }
      .error { color: #c93f00; margin: 8px 0; }
      .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }

      .login-foot {
        margin-top: 8px;
        text-align: center;
        color: #ffffff;
        font-weight: 700;
      }

      .app-layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 22px;
        align-items: start;
        transition: grid-template-columns 0.2s ease;
      }

      .app-layout.nav-collapsed {
        grid-template-columns: 78px minmax(0, 1fr);
      }

      #appView {
        margin-top: 14px;
      }

      .workspace-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(90deg, #103c70 0%, #0f457f 68%, #1e5b97 100%);
        color: #ffffff;
        border-radius: 0;
        padding: 14px 16px;
        box-shadow: 0 10px 24px rgba(0, 40, 87, 0.25);
        margin: 0 -22px 18px;
      }

      .workspace-title {
        margin: 0;
        font-size: 1.7rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .workspace-date {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.08));
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ff8a28;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 1.1rem;
        font-weight: 800;
        backdrop-filter: blur(3px);
      }

      .workspace-area {
        background:
          linear-gradient(180deg, #eef2f7 0%, #edf2f9 100%);
        margin: 0 -22px -22px;
        padding: 20px 10px 28px;
        min-height: 60vh;
      }

      .app-layout.nav-collapsed main {
        width: 100%;
      }

      .app-layout.nav-collapsed .workspace-panel,
      .app-layout.nav-collapsed .workspace-panel .chart-box,
      .app-layout.nav-collapsed .workspace-panel .table-wrap {
        width: 100%;
      }

      .side-menu {
        background: #ffffff;
        color: #0f3567;
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 14px 30px rgba(15, 53, 103, 0.12);
        height: fit-content;
        position: sticky;
        top: 16px;
        transition: width 0.2s ease, padding 0.2s ease, transform 0.2s ease;
        overflow: hidden;
      }

      .side-menu-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .side-menu h3 {
        margin: 0;
        font-size: 1.05rem;
      }

      .nav-toggle {
        width: 34px;
        height: 34px;
        min-width: 34px;
        border-radius: 999px;
        border: 1px solid #d7deea;
        background: #f5f8fc;
        color: #0f3567;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.2s ease;
      }

      .nav-toggle {
        display: none;
      }

      .nav-toggle:hover {
        transform: translateY(-1px);
        background: #eaf0f8;
      }

      .menu-separator {
        height: 1px;
        background: #d7deea;
        margin: 14px 0;
      }

      .menu-btn {
        display: block;
        width: 100%;
        border: none;
        background: #edf1f7;
        color: #0f3567;
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
        text-align: left;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .menu-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(15, 53, 103, 0.13);
      }

      .menu-btn.active {
        background: #0d3260;
        color: #ffffff;
        border-left: 4px solid #ff7a1a;
      }

      .menu-btn.action-warning {
        background: #fff3de;
        color: #ff6a00;
      }

      .menu-btn.action-danger {
        background: #ffe9ef;
        color: #d6324e;
      }

      .menu-btn i {
        margin-right: 9px;
      }

      .menu-text {
        display: inline;
      }

      .side-menu.collapsed {
        width: 78px;
        padding: 18px 10px;
      }

      .side-menu.collapsed .side-menu-header {
        justify-content: center;
      }

      .side-menu.collapsed h3,
      .side-menu.collapsed .menu-separator,
      .side-menu.collapsed .menu-text {
        display: none;
      }

      .side-menu.collapsed .menu-btn {
        width: 52px;
        padding: 12px 0;
        text-align: center;
        margin-left: auto;
        margin-right: auto;
      }

      .side-menu.collapsed .menu-btn i {
        margin-right: 0;
      }

      .side-menu.collapsed .nav-toggle i {
        transform: rotate(180deg);
      }

      .workspace-panel {
        border-radius: 0;
        border: none;
        box-shadow: none;
        background: transparent;
        padding: 0;
        animation: panelIn 0.35s ease;
      }

      @keyframes panelIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .workspace-panel h2 {
        margin: 0;
        color: #0f3567;
      }

      .panel-rule {
        border: none;
        border-top: 2px solid #dbe2ee;
        margin: 12px 0 16px;
      }

      .field-label {
        color: #0f3567;
        font-weight: 700;
        margin-bottom: 6px;
      }

      .app-select {
        border: 2px solid #d4dbe8;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1.05rem;
        color: #0f3567;
      }

      .entry-form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      .entry-field {
        display: grid;
        gap: 6px;
      }

      .entry-input,
      .entry-select {
        border: 2px solid #d4dbe8;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 1rem;
        color: #0f3567;
        background: #ffffff;
        width: 100%;
        box-sizing: border-box;
      }

      .entry-help {
        color: #4b6281;
        font-size: 0.9rem;
      }

      .result-box {
        background: #f6f9ff;
        border: 1px solid #d7e0ef;
        border-radius: 12px;
        padding: 12px;
        box-shadow: inset 0 1px 0 #ffffff;
      }

      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 6px 10px;
        font-weight: 700;
        font-size: 0.9rem;
      }

      .status-good {
        color: #0c7a43;
        background: #e7f9ef;
        border: 1px solid #bdebd1;
      }

      .status-bad {
        color: #c02a2a;
        background: #ffeaea;
        border: 1px solid #ffcaca;
      }

      .table-wrap {
        overflow-x: auto;
      }

      .dashboard-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .dashboard-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 16px;
        align-items: start;
      }

      .dashboard-main-column,
      .dashboard-ranking-column {
        min-width: 0;
      }

      .dashboard-ranking-column {
        position: sticky;
        top: 16px;
        min-width: 340px;
      }

      .dashboard-ranking-column .nav-ranking-panel {
        margin-top: 0;
      }

      .dashboard-ranking-column .nav-ranking-list {
        max-height: none;
        overflow: visible;
        padding-right: 0;
      }

      .dashboard-summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }

      .dashboard-summary-card {
        border-radius: 16px;
        padding: 14px 16px;
        background: linear-gradient(180deg, #ffffff 0%, #f5f8fd 100%);
        border: 1px solid #dce3ef;
        box-shadow: 0 10px 24px rgba(15, 53, 103, 0.08);
      }

      .dashboard-summary-label {
        margin: 0 0 6px;
        color: #4b6281;
        font-size: 0.92rem;
        font-weight: 700;
      }

      .dashboard-summary-value {
        margin: 0;
        color: #0f3567;
        font-size: 1.7rem;
        font-weight: 900;
        line-height: 1.05;
      }

      .dashboard-summary-note {
        margin: 8px 0 0;
        color: #6a7f99;
        font-size: 0.86rem;
      }

      .chart-box {
        min-height: max(420px, calc(100vh - 360px));
        box-sizing: border-box;
        background: #ffffff;
        border: 1px solid #e3e9f3;
        border-radius: 14px;
        padding: 12px;
        margin: 10px 0 14px;
      }

      .ranking-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        margin-bottom: 12px;
      }

      .ranking-card {
        border-radius: 16px;
        padding: 16px;
        border: 1px solid #dce3ef;
        background: linear-gradient(180deg, #ffffff 0%, #f7f9fd 100%);
        box-shadow: 0 10px 24px rgba(15, 53, 103, 0.08);
      }

      .ranking-card.top-1 {
        border-color: rgba(255, 193, 7, 0.35);
        box-shadow: 0 12px 26px rgba(255, 193, 7, 0.16);
      }

      .ranking-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 38px;
        height: 38px;
        border-radius: 999px;
        font-weight: 800;
        margin-bottom: 10px;
        color: #0f3567;
        background: #eaf0f8;
      }

      .ranking-title {
        margin: 0 0 6px;
        color: #0f3567;
        font-size: 1.05rem;
      }

      .ranking-meta {
        margin: 0;
        color: #4b6281;
        font-size: 0.92rem;
      }

      .ranking-value {
        margin-top: 10px;
        font-size: 1.35rem;
        font-weight: 800;
      }

      .ranking-good {
        color: #0c7a43;
      }

      .ranking-bad {
        color: #c02a2a;
      }

      .nav-ranking-panel {
        margin: 0;
        padding: 16px;
        border: 0.5px solid #e2e8f0;
        border-radius: 16px;
        background: #ffffff;
        color: #0b2a5b;
        box-shadow: none;
      }

      .nav-ranking-header {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        margin-bottom: 16px;
      }

      .ranking-title-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .nav-ranking-header h4 {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1rem;
        font-weight: 700;
        color: #0b2a5b;
      }

      .nav-ranking-header h4 i {
        color: #b45309;
        font-size: 1rem;
      }

      .ranking-panel-date {
        color: #64748b;
        font-size: 0.7rem;
        font-weight: 500;
        white-space: nowrap;
      }

      .ranking-mode-toggle {
        display: inline-flex;
        align-self: flex-start;
        gap: 3px;
        padding: 3px;
        border: 0;
        border-radius: 9px;
        background: #f1f5f9;
      }

      .nav-ranking-panel .ranking-mode-btn {
        border: none;
        border-radius: 7px;
        padding: 7px 12px;
        font-size: 0.76rem;
        font-weight: 650;
        color: #64748b;
        background: transparent;
        box-shadow: none;
        cursor: pointer;
      }

      .nav-ranking-panel .ranking-mode-btn.active {
        background: #0b2a5b;
        color: #ffffff;
        box-shadow: none;
      }

      .nav-ranking-panel .ranking-mode-btn:hover,
      .nav-ranking-panel .ranking-mode-btn:active {
        transform: none;
        box-shadow: none;
      }

      .nav-ranking-list {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .ranking-champion {
        padding: 12px;
        border: 1px solid #fcd34d;
        border-radius: 12px;
        background: #fffbeb;
      }

      .ranking-champion-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .ranking-champion-person {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 9px;
      }

      .ranking-champion-medal {
        display: grid;
        flex: 0 0 30px;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 50%;
        background: #fde68a;
        color: #92400e;
        font-size: 0.9rem;
      }

      .ranking-champion-name {
        overflow: hidden;
        color: #0b2a5b;
        font-size: 0.86rem;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ranking-champion-subtitle {
        margin-top: 2px;
        color: #64748b;
        font-size: 0.68rem;
      }

      .ranking-champion-value {
        color: #15803d;
        font-size: 1.12rem;
        font-weight: 750;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }

      .ranking-progress-track {
        position: relative;
        height: 8px;
        margin-top: 13px;
        overflow: visible;
        border-radius: 999px;
        background: #e2e8f0;
      }

      .ranking-progress-fill {
        height: 100%;
        border-radius: inherit;
        background: #15803d;
      }

      .ranking-progress-fill.below-target {
        background: #d97706;
      }

      .ranking-rfc-marker {
        position: absolute;
        z-index: 1;
        top: -4px;
        bottom: -4px;
        left: var(--ranking-target);
        border-left: 2px dashed #0b2a5b;
      }

      .ranking-champion-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 9px;
      }

      .ranking-target-label {
        color: #64748b;
        font-size: 0.66rem;
      }

      .ranking-gap-pill {
        padding: 4px 8px;
        border-radius: 999px;
        background: #dcfce7;
        color: #15803d;
        font-size: 0.64rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .ranking-gap-pill.below-target {
        background: #fef3c7;
        color: #b45309;
      }

      .ranking-gap-pill.comparison-yesterday {
        background: #eef2f6;
        color: #526782;
      }

      }

      function findGammeByReference(reference, line) {
        const ref = String(reference || '').trim().toLowerCase();
        if (!ref) return null;

        const normalizeReference = (value) => String(value || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        const normalizeDigits = (value) => String(value || '').replace(/\D/g, '');
        const selectedLine = String(line || '').trim().toLowerCase();
        const sameLine = (item) => String(item.line || '').trim().toLowerCase() === selectedLine;

        const exactMatches = appGammes.filter((item) => normalizeReference(item.reference) === normalizeReference(ref));
        const exactLineMatch = exactMatches.find(sameLine);
        if (exactLineMatch) return exactLineMatch;
        if (exactMatches.length === 1) return exactMatches[0];
        if (exactMatches.length > 1) return null;

        const suffix = normalizeDigits(ref);
        if (suffix.length !== 4) return null;

        const suffixMatches = appGammes.filter((item) => normalizeDigits(item.reference).endsWith(suffix));
        const suffixLineMatches = suffixMatches.filter(sameLine);
        const candidates = suffixLineMatches.length ? suffixLineMatches : suffixMatches;
        return candidates.length === 1 ? candidates[0] : null;
      }

              </div>
            </div>
            <aside class="dashboard-ranking-column">
              <div class="nav-ranking-panel">
                <div class="nav-ranking-header">
                  <div class="ranking-title-line">
                    <h4><i class="bi bi-trophy-fill"></i> Ranking challenge</h4>
                    <span id="dashboardRankingDate" class="ranking-panel-date">${formatDateLabel(defaultDate)}</span>
                  </div>
                  <div class="ranking-mode-toggle" aria-label="Mode de classement">
                    <button id="rankingModeEfficiency" class="ranking-mode-btn ${dashboardRankingMode === 'efficiency' ? 'active' : ''}" type="button" onclick="setRankingMode('efficiency')">Efficiency</button>
                    <button id="rankingModeEcart" class="ranking-mode-btn ${dashboardRankingMode === 'ecart' ? 'active' : ''}" type="button" onclick="setRankingMode('ecart')">Écart RFC</button>
                  </div>
                </div>
                <div id="dashboardRankingContent" class="nav-ranking-list"></div>
              </div>
            </aside>
          </div>
        `;

        if (!userEntries.length) {
          html += '<p class="muted">Aucune saisie d\'efficience pour le moment.</p>';
        }
        document.getElementById('dashboardContent').innerHTML = html;
        const craLoadStatus = document.getElementById('craHoursLoadStatus');
        if (craLoadStatus) craLoadStatus.textContent = craHoursLoadError;
        onDashboardDateChange();
      }

      function renderSuivi() {
        const ownedEntries = appEntries.filter((item) => currentUser.role === 'superadmin' || item.user_id === currentUser.id || item.userId === currentUser.id);
        const dates = getAvailableEntryDates();
        const selectedDate = dashboardSelectedDate || dates[0] || getTodayKey();
        const dateBounds = getDateBounds();

        let html = `
          <h2><i class="bi bi-calendar3"></i> Suivi des saisies</h2>
          <hr class="panel-rule">
          <div class="dashboard-toolbar">
            <label class="field-label mb-0">Date:</label>
            <input id="suiviDateFilter" class="entry-input" type="date" value="${selectedDate}" min="${dateBounds.min}" max="${dateBounds.max}" style="max-width:260px" onchange="onSuiviDateChange()">
          </div>
          <div id="suiviTableWrap"></div>
        `;

        document.getElementById('suiviContent').innerHTML = html;
        onSuiviDateChange();
      }

      function onSuiviDateChange() {
        const dateEl = document.getElementById('suiviDateFilter');
        const wrapEl = document.getElementById('suiviTableWrap');
        if (!dateEl || !wrapEl) return;

        const selectedDate = dateEl.value || getTodayKey();
        dashboardSelectedDate = selectedDate;

        const filtered = appEntries
          .filter((item) => (currentUser.role === 'superadmin' || item.user_id === currentUser.id || item.userId === currentUser.id) && getEntryDate(item) === selectedDate)
          .slice()
          .reverse();

        if (!filtered.length) {
          wrapEl.innerHTML = '<p class="muted">Aucune saisie pour cette date.</p>';
          return;
        }

        let table = '<div class="table-wrap"><table class="simple-table"><thead><tr><th>Date</th><th>Ligne</th><th>Référence</th><th>Effectif</th><th>Quantité</th><th>Temps gamme</th><th>RFC</th><th>Efficience</th><th>Écart</th></tr></thead><tbody>';
        filtered.forEach((item) => {
          const rfcVal = Number(item.rfc || 0);
          const effVal = Number(item.efficiency || 0);
          const ecartVal = Number.isFinite(Number(item.ecart)) ? Number(item.ecart) : calculateEcart(effVal, rfcVal);
          const ecartClass = ecartVal >= 0 ? 'status-chip status-good' : 'status-chip status-bad';
          const ecartLabel = `${ecartVal >= 0 ? '+' : ''}${ecartVal.toFixed(2)}%`;
          table += `<tr><td>${formatDateLabel(getEntryDate(item))}</td><td>${item.line || '-'}</td><td>${item.reference || '-'}</td><td>${item.effectif || '-'}</td><td>${item.quantity || '-'}</td><td>${item.gamme_time || '-'} h</td><td>${rfcVal.toFixed(2)}%</td><td>${effVal.toFixed(2)}%</td><td><span class="${ecartClass}">${ecartLabel}</span></td></tr>`;
        });
        table += '</tbody></table></div>';
        wrapEl.innerHTML = table;
      }

      function onDashboardDateChange() {
        const selectEl = document.getElementById('dashboardDateFilter');
        if (!selectEl) return;

        const selectedDate = dashboardSelectedDate || selectEl.value;
        dashboardSelectedDate = selectedDate;
        const filtered = getDashboardEntries().filter((item) => getEntryDate(item) === selectedDate);

        const effectifTotal = filtered.reduce((sum, item) => sum + Number(item.effectif || 0), 0);
        const cadenceTotal = filtered.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
        const weightedOutput = filtered.reduce((sum, item) => sum + (Number(item.quantity || 0) * Number(item.gamme_time || 0)), 0);
        const includeCraHours = currentUser.role === 'superadmin' && getDashboardOwnerId() === 'all';
        const craHoursForDate = includeCraHours ? getCraHours(selectedDate) : null;
        const hoursProduced = weightedOutput + Number(craHoursForDate?.produced_hours || 0);
        const availableHours = effectifTotal * WORKING_HOURS + Number(craHoursForDate?.presence_hours || 0);
        const globalEfficiency = availableHours > 0 ? (hoursProduced / availableHours) * 100 : 0;

        const summaryEffectif = document.getElementById('summaryEffectif');
        const summaryHours = document.getElementById('summaryHours');
        const summaryCadence = document.getElementById('summaryCadence');
        const summaryEfficiency = document.getElementById('summaryEfficiency');
        if (summaryEffectif) summaryEffectif.textContent = `${effectifTotal}`;
        if (summaryHours) summaryHours.textContent = `${hoursProduced.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} h`;
        if (summaryCadence) summaryCadence.textContent = `${cadenceTotal}`;
        if (summaryEfficiency) summaryEfficiency.textContent = `${globalEfficiency.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%`;

        const rfcInput = document.getElementById('dashboardRfcFilter');
        const globalRfc = Number.isFinite(Number(rfcInput?.value))
          ? Number(rfcInput.value)
          : (filtered.length ? filtered.reduce((sum, item) => sum + Number(item.rfc || 0), 0) / filtered.length : 0);

        const selectedDay = new Date(`${selectedDate}T00:00:00`);
        selectedDay.setDate(selectedDay.getDate() - 1);
        const previousDate = `${selectedDay.getFullYear()}-${String(selectedDay.getMonth() + 1).padStart(2, '0')}-${String(selectedDay.getDate()).padStart(2, '0')}`;
        const previousEntries = getDashboardEntries().filter((item) => getEntryDate(item) === previousDate);
        const previousEffectif = previousEntries.reduce((sum, item) => sum + Number(item.effectif || 0), 0);
        const previousCraHours = includeCraHours ? getCraHours(previousDate) : null;
        const previousHours = previousEntries.reduce((sum, item) => sum + Number(item.quantity || 0) * Number(item.gamme_time || 0), 0)
          + Number(previousCraHours?.produced_hours || 0);
        const previousCadence = previousEntries.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
        const previousPresenceHours = previousEffectif * WORKING_HOURS + Number(previousCraHours?.presence_hours || 0);
        const previousEfficiency = previousPresenceHours > 0 ? (previousHours / previousPresenceHours) * 100 : 0;
        const efficiencyVsYesterday = globalEfficiency - previousEfficiency;
        const hoursDelta = hoursProduced - previousHours;
        const cadenceDelta = cadenceTotal - previousCadence;
        const efficiencyDelta = globalEfficiency - globalRfc;
        const formatSigned = (value, digits = 0) => {
          const sign = value > 0 ? '+' : value < 0 ? '−' : '';
          return `${sign}${Math.abs(value).toLocaleString('fr-FR', { minimumFractionDigits: digits, maximumFractionDigits: digits })}`;
        };
        const setDelta = (id, text, value) => {
          const badge = document.getElementById(id);
          if (!badge) return;
          badge.textContent = text;
          badge.classList.toggle('positive', value > 0);
          badge.classList.toggle('negative', value < 0);
        };
        const effectifDelta = document.getElementById('summaryEffectifDelta');
        if (effectifDelta) {
          const effectifChange = effectifTotal - previousEffectif;
          effectifDelta.textContent = effectifChange === 0 ? 'stable' : `${formatSigned(effectifChange)} vs hier`;
          effectifDelta.classList.toggle('positive', effectifChange > 0);
          effectifDelta.classList.toggle('negative', effectifChange < 0);
        }
        setDelta('summaryHoursDelta', `${formatSigned(hoursDelta, 2)} h vs hier`, hoursDelta);
        setDelta('summaryCadenceDelta', `${formatSigned(cadenceDelta)} vs hier`, cadenceDelta);
        setDelta('summaryEfficiencyDelta', `${formatSigned(efficiencyDelta, 2)} pts vs RFC · ${formatSigned(efficiencyVsYesterday, 2)} pts vs hier`, efficiencyDelta);

        renderNavRanking(filtered);

        let labels = [];
        let values = [];
        let colors = [];
        let borders = [];
        let projectLineValues = null;
        const projectLineEfficiencies = new Map();

        if (currentUser.role === 'superadmin' && getDashboardOwnerId() !== 'all') {
          const efficiency = Number(globalEfficiency.toFixed(2));
          const byLine = new Map();
          filtered.forEach((item) => {
            const line = item.line || item.ligne || item.line_name || item.lineName || 'Sans ligne';
            const current = byLine.get(line) || { effectifTotal: 0, weightedOutput: 0 };
            current.effectifTotal += Number(item.effectif || 0);
            current.weightedOutput += Number(item.quantity || 0) * Number(item.gamme_time || 0);
            byLine.set(line, current);
          });

          const lineMetrics = Array.from(byLine.entries()).map(([line, data]) => {
            const lineAvailableHours = data.effectifTotal * WORKING_HOURS;
            return {
              line,
              efficiency: lineAvailableHours > 0 ? Number(((data.weightedOutput / lineAvailableHours) * 100).toFixed(2)) : 0
            };
          }).sort((a, b) => b.efficiency - a.efficiency);

          labels = ['Efficience globale', ...lineMetrics.map((item) => item.line)];
          values = [efficiency, ...lineMetrics.map((item) => item.efficiency)];
          colors = [
            efficiency - globalRfc < 0 ? 'rgba(220, 53, 69, 0.9)' : 'rgba(13, 50, 96, 0.9)',
            ...lineMetrics.map((item) => item.efficiency - globalRfc < 0 ? 'rgba(217, 119, 6, 0.88)' : 'rgba(21, 128, 61, 0.85)')
          ];
          borders = [
            efficiency - globalRfc < 0 ? 'rgba(176, 34, 50, 1)' : 'rgba(11, 42, 91, 1)',
            ...lineMetrics.map((item) => item.efficiency - globalRfc < 0 ? 'rgba(180, 83, 9, 1)' : 'rgba(21, 128, 61, 1)')
          ];
          projectLineValues = true;
        } else if (currentUser.role === 'superadmin' && getDashboardOwnerId() === 'all') {
          const byUser = new Map();
          const configuredUserIds = new Set(getDashboardSelectableUsers().filter((user) => !user.unavailable).map((user) => user.id));
          filtered.forEach((item) => {
            const ownerId = item.user_id || item.userId;
            if (!ownerId || !configuredUserIds.has(ownerId)) return;
            const existing = byUser.get(ownerId) || { effectifTotal: 0, weightedOutput: 0 };
            existing.effectifTotal += Number(item.effectif || 0);
            existing.weightedOutput += Number(item.quantity || 0) * Number(item.gamme_time || 0);
            byUser.set(ownerId, existing);
          });

          const accountMetrics = Array.from(byUser.entries()).map(([ownerId, data]) => {
            const hours = data.effectifTotal * WORKING_HOURS;
            const efficiency = hours > 0 ? (data.weightedOutput / hours) * 100 : 0;
            const lines = new Map();
            filtered.filter((entry) => (entry.user_id || entry.userId) === ownerId).forEach((entry) => {
              const line = entry.line || entry.ligne || entry.line_name || entry.lineName || 'Sans ligne';
              const lineData = lines.get(line) || { effectifTotal: 0, weightedOutput: 0 };
              lineData.effectifTotal += Number(entry.effectif || 0);
              lineData.weightedOutput += Number(entry.quantity || 0) * Number(entry.gamme_time || 0);
              lines.set(line, lineData);
            });
            const lineMetrics = Array.from(lines.entries()).map(([line, lineData]) => {
              const lineHours = lineData.effectifTotal * WORKING_HOURS;
              const lineEfficiency = lineHours > 0 ? (lineData.weightedOutput / lineHours) * 100 : 0;
              return { line, efficiency: lineEfficiency };
            }).sort((a, b) => b.efficiency - a.efficiency);
            const label = getUserLabelById(ownerId);
            projectLineEfficiencies.set(label, lineMetrics);
            return {
              label,
              value: Number(efficiency.toFixed(2))
            };
          });
          const craHours = getCraHours(selectedDate);
          accountMetrics.push({
            label: CRA_PROJECT_LABEL,
            value: craHours ? Number(calculateHoursEfficiency(craHours.produced_hours, craHours.presence_hours).toFixed(2)) : 0
          });
          accountMetrics.sort((a, b) => b.value - a.value);

          labels = accountMetrics.map((item) => item.label);
          values = accountMetrics.map((item) => item.value);
          colors = accountMetrics.map((item) => item.value - globalRfc < 0 ? 'rgba(220, 53, 69, 0.85)' : 'rgba(25, 135, 84, 0.85)');
          borders = accountMetrics.map((item) => item.value - globalRfc < 0 ? 'rgba(176, 34, 50, 1)' : 'rgba(17, 109, 65, 1)');
        } else {
          const byLine = new Map();
          filtered.forEach((item) => {
            const line = item.line || 'Sans ligne';
            const existing = byLine.get(line) || { effectifTotal: 0, weightedOutput: 0, rfcSum: 0, count: 0 };
            existing.effectifTotal += Number(item.effectif || 0);
            existing.weightedOutput += Number(item.quantity || 0) * Number(item.gamme_time || 0);
            existing.rfcSum += Number(item.rfc || 0);
            existing.count += 1;
            byLine.set(line, existing);
          });

          labels = Array.from(byLine.keys());
          values = labels.map((line) => {
            const data = byLine.get(line);
            const hours = Number(data.effectifTotal || 0) * WORKING_HOURS;
            const globalLineEfficiency = hours > 0 ? (Number(data.weightedOutput || 0) / hours) * 100 : 0;
            return Number(globalLineEfficiency.toFixed(2));
          });
          colors = labels.map((line) => {
            const index = labels.indexOf(line);
            const lineEff = Number(values[index] || 0);
            const lineEcart = lineEff - globalRfc;
            return lineEcart < 0 ? 'rgba(220, 53, 69, 0.85)' : 'rgba(25, 135, 84, 0.85)';
          });
          borders = labels.map((line) => {
            const index = labels.indexOf(line);
            const lineEff = Number(values[index] || 0);
            const lineEcart = lineEff - globalRfc;
            return lineEcart < 0 ? 'rgba(176, 34, 50, 1)' : 'rgba(17, 109, 65, 1)';
          });
        }

        const canvas = document.getElementById('dashboardEfficiencyChart');
        if (!canvas || typeof Chart === 'undefined') return;
        canvas.ondblclick = (event) => {
          if (currentUser.role !== 'superadmin' || getDashboardOwnerId() !== 'all' || !dashboardChart) return;
          const position = Chart.helpers.getRelativePosition(event, dashboardChart);
          const area = dashboardChart.chartArea;
          if (position.x < area.left || position.x > area.right || position.y < area.top || position.y > dashboardChart.height) return;
          const index = dashboardChart.scales.x.getValueForPixel(position.x);
          if (dashboardChart.data.labels[index] === CRA_PROJECT_LABEL) openCraHoursEditor();
        };

        const ctx = canvas.getContext('2d');
        if (dashboardChart) {
          dashboardChart.destroy();
          dashboardChart = null;
        }

        const barValueLabelPlugin = {
          id: 'barValueLabelPlugin',
          afterDatasetsDraw(chart) {
            const barDataset = chart.data.datasets[0];
            const meta = chart.getDatasetMeta(0);
            if (!barDataset || !meta || meta.hidden) return;

            const { ctx: chartContext } = chart;
            chartContext.save();
            chartContext.fillStyle = '#ffffff';
            chartContext.textAlign = 'center';
            chartContext.textBaseline = 'middle';
            chartContext.font = '800 20px "Plus Jakarta Sans", sans-serif';

            meta.data.forEach((barElement, index) => {
              const value = Number(barDataset.data[index] || 0);
              if (!Number.isFinite(value) || value <= 0) return;

              const centerX = barElement.x;
              const centerY = (barElement.y + barElement.base) / 2;
              chartContext.fillText(`${value.toFixed(2)}%`, centerX, centerY);
            });

            chartContext.restore();
          }
        };

        const rfcDataset = {
          type: 'line',
          label: 'RFC global (%)',
          data: labels.length ? labels.map(() => Number(globalRfc.toFixed(2))) : [Number(globalRfc.toFixed(2))],
          borderColor: '#0d6efd',
          backgroundColor: 'rgba(13, 110, 253, 0.12)',
          borderWidth: 3,
          tension: 0,
          pointRadius: 0,
          pointHoverRadius: 0,
          pointBackgroundColor: '#0d6efd',
          pointBorderColor: '#ffffff',
          pointBorderWidth: 2,
          fill: false
        };
        const efficiencyDatasets = projectLineValues
          ? [{
              label: 'Efficience globale et par ligne (%)',
              data: values,
              backgroundColor: colors,
              borderColor: borders,
              borderWidth: 1,
              borderRadius: 8
            }, rfcDataset]
          : [{
              label: 'Efficience globale (%)',
              data: values.length ? values : [0],
              backgroundColor: colors.length ? colors : ['rgba(13, 50, 96, 0.8)'],
              borderColor: borders.length ? borders : ['rgba(255, 122, 26, 1)'],
              borderWidth: 1,
              borderRadius: 8
            }, rfcDataset];

        dashboardChart = new Chart(ctx, {
          plugins: [barValueLabelPlugin],
          type: 'bar',
          data: {
            labels: labels.length ? labels : ['Aucune donnée'],
            datasets: efficiencyDatasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                title: { display: true, text: 'Valeurs (%)' }
              },
              x: {
                title: { display: true, text: projectLineValues ? 'Projet et lignes de production' : 'Lignes' }
              }
            },
            plugins: {
              legend: { display: true },
              tooltip: {
                callbacks: {
                  label(context) {
                    if (currentUser.role !== 'superadmin' || getDashboardOwnerId() !== 'all') {
                      const value = Number(context.parsed?.y ?? context.raw ?? 0);
                      return `${context.dataset.label}: ${value.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} %`;
                    }

                    const projectLabel = context.label;
                    return `${projectLabel} + Efficiency`;
                  },
                  afterBody(items) {
                    if (currentUser.role !== 'superadmin' || getDashboardOwnerId() !== 'all' || !items.length) return [];
                    if (items[0].label === CRA_PROJECT_LABEL) {
                      const hours = getCraHours(selectedDate);
                      return hours ? [
                        `Heures produites : ${Number(hours.produced_hours).toLocaleString('fr-FR')} h`,
                        `Heures de présence : ${Number(hours.presence_hours).toLocaleString('fr-FR')} h`,
                        `Efficience : ${calculateHoursEfficiency(hours.produced_hours, hours.presence_hours).toLocaleString('fr-FR', { maximumFractionDigits: 2 })} %`,
                        'Double-clique pour modifier les heures.'
                      ] : ['Aucune saisie : double-clique pour saisir les heures.'];
                    }
                    const lineMetrics = projectLineEfficiencies.get(items[0].label) || [];
                    if (!lineMetrics.length) return ['Aucune ligne saisie pour ce projet à cette date.'];
                    return [
                      'Efficience par ligne :',
                      ...lineMetrics.map((item) => `${item.line} : ${item.efficiency.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} %`)
                    ];
                  }
                }
              }
            }
          }
        });
      }

      function renderNavRanking(filteredEntries) {
        const rankingEl = document.getElementById('dashboardRankingContent');
        if (!rankingEl) return;

        const dateLabel = document.getElementById('dashboardRankingDate');
        if (dateLabel) dateLabel.textContent = formatDateLabel(dashboardSelectedDate || getTodayKey());

        const configuredUserIds = new Set(getDashboardSelectableUsers().filter((user) => !user.unavailable).map((user) => user.id));
        const sourceEntries = filteredEntries.filter((item) => currentUser.role === 'superadmin'
          ? configuredUserIds.has(item.user_id || item.userId)
          : item.user_id === currentUser.id || item.userId === currentUser.id);
        const rfcInput = document.getElementById('dashboardRfcFilter');
        const targetRfc = Number.isFinite(Number(rfcInput?.value)) ? Number(rfcInput.value) : 80;
        const aggregate = new Map();
        const rankingByProject = currentUser.role === 'superadmin' && getDashboardOwnerId() === 'all';
        const selectedDay = new Date(`${dashboardSelectedDate || getTodayKey()}T00:00:00`);
        selectedDay.setDate(selectedDay.getDate() - 1);
        const previousDate = `${selectedDay.getFullYear()}-${String(selectedDay.getMonth() + 1).padStart(2, '0')}-${String(selectedDay.getDate()).padStart(2, '0')}`;
        const selectedOwnerId = getDashboardOwnerId();
        const previousEntries = appEntries.filter((item) => {
          if (getEntryDate(item) !== previousDate) return false;
          const ownerId = item.user_id || item.userId;
          if (currentUser.role !== 'superadmin') return ownerId === currentUser.id;
          if (selectedOwnerId !== 'all') return ownerId === selectedOwnerId;
          return configuredUserIds.has(ownerId);
        });
        const getRankingKey = (item) => rankingByProject
          ? (item.user_id || item.userId)
          : (item.line || item.ligne || item.line_name || item.lineName || 'Sans ligne');

        sourceEntries.forEach((item) => {
          const key = getRankingKey(item);
          if (!key) return;

          const current = aggregate.get(key) || {
            label: rankingByProject ? getUserLabelById(key) : key,
            effectifTotal: 0,
            weightedOutput: 0,
            count: 0
          };
          current.effectifTotal += Number(item.effectif || 0);
          current.weightedOutput += Number(item.quantity || 0) * Number(item.gamme_time || 0);
          current.count += 1;
          aggregate.set(key, current);
        });

        previousEntries.forEach((item) => {
          const key = getRankingKey(item);
          const current = aggregate.get(key);
          if (!current) return;
          current.previousEffectifTotal = (current.previousEffectifTotal || 0) + Number(item.effectif || 0);
          current.previousWeightedOutput = (current.previousWeightedOutput || 0) + Number(item.quantity || 0) * Number(item.gamme_time || 0);
          current.previousCount = (current.previousCount || 0) + 1;
        });

        const ranking = Array.from(aggregate.values()).map((item) => {
          const availableHours = item.effectifTotal * WORKING_HOURS;
          const efficiency = availableHours > 0 ? (item.weightedOutput / availableHours) * 100 : 0;
          const previousAvailableHours = Number(item.previousEffectifTotal || 0) * WORKING_HOURS;
          const previousEfficiency = previousAvailableHours > 0
            ? (Number(item.previousWeightedOutput || 0) / previousAvailableHours) * 100
            : null;
          return {
            ...item,
            efficiency,
            gap: efficiency - targetRfc,
            gapYesterday: previousEfficiency === null ? null : efficiency - previousEfficiency
          };
        }).sort((a, b) => {
          if (dashboardRankingMode === 'ecart' && b.gap !== a.gap) return b.gap - a.gap;
          if (b.efficiency !== a.efficiency) return b.efficiency - a.efficiency;
          return a.label.localeCompare(b.label, 'fr', { sensitivity: 'base' });
        });

        const formatNumber = (value, digits = 1) => Number(value || 0).toLocaleString('fr-FR', {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        });
        const formatGap = (value, digits = 2) => `${value > 0 ? '+' : ''}${formatNumber(value, digits)}`;
        const escapeText = (value) => String(value).replace(/[&<>"']/g, (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[character]);
        const targetLabel = formatNumber(targetRfc, 0);
        const markerPosition = Math.max(0, Math.min(100, (targetRfc / 120) * 100));
        let html = '';

        if (ranking.length) {
          const champion = ranking[0];
          const championGapClass = champion.gap < 0 ? 'below-target' : '';
          const championYesterdayClass = champion.gapYesterday === null ? '' : champion.gapYesterday >= 0 ? 'positive' : 'negative';
          const championProgress = Math.max(0, Math.min(100, (champion.efficiency / 120) * 100));
          const championPlace = champion.count === 1 ? '1re place · 1 saisie' : `1re place · ${champion.count} saisies`;
          html += `
            <article class="ranking-champion">
              <div class="ranking-champion-head">
                <div class="ranking-champion-person">
                  <span class="ranking-champion-medal"><i class="bi bi-award-fill" aria-hidden="true"></i></span>
                  <div>
                    <div class="ranking-champion-name">${escapeText(champion.label)}</div>
                    <div class="ranking-champion-subtitle">${championPlace}</div>
                  </div>
                </div>
                <div class="ranking-champion-value">${formatNumber(champion.efficiency, 2)} %</div>
              </div>
              <div class="ranking-progress-track" style="--ranking-target:${markerPosition}%">
                <div class="ranking-progress-fill ${championGapClass}" style="width:${championProgress}%"></div>
                <span class="ranking-rfc-marker" aria-hidden="true"></span>
              </div>
              <div class="ranking-champion-foot">
                <span class="ranking-target-label">Objectif RFC : ${targetLabel} %</span>
                <span class="ranking-gap-pill ${championGapClass}">${formatGap(champion.gap)} pts vs RFC</span>
                <span class="ranking-gap-pill comparison-yesterday ${championYesterdayClass}">${champion.gapYesterday === null ? '—' : `${formatGap(champion.gapYesterday)} pts`} vs hier</span>
              </div>
            </article>
          `;

          const maxEfficiency = Math.max(champion.efficiency, 0.01);
          ranking.slice(1).forEach((item, index) => {
            const rank = index + 2;
            const belowTarget = item.gap < 0;
            const barWidth = Math.max(0, Math.min(100, (item.efficiency / maxEfficiency) * 100));
            const rankBadge = rank === 2 || rank === 3
              ? '<i class="bi bi-award-fill" aria-hidden="true"></i>'
              : String(rank);
            const yesterdayClass = item.gapYesterday === null ? '' : item.gapYesterday >= 0 ? 'positive' : 'negative';
            html += `
              <div class="nav-ranking-item top-${rank}">
                <div class="nav-ranking-line">
                  <span class="nav-ranking-medal">${rankBadge}</span>
                  <span>${escapeText(item.label)}</span>
                  <span class="ranking-row-value">${formatNumber(item.efficiency, 1)} %</span>
                </div>
                <div class="ranking-row-detail">
                  <div class="ranking-row-track"><div class="ranking-row-fill ${belowTarget ? 'below-target' : ''}" style="width:${barWidth}%"></div></div>
                  <span class="ranking-row-deltas">
                    <span class="ranking-row-delta ${belowTarget ? 'below-target' : ''}">${formatGap(item.gap, 1)} pts RFC</span>
                    <span class="ranking-row-delta yesterday ${yesterdayClass}">${item.gapYesterday === null ? '—' : `${formatGap(item.gapYesterday, 1)} pts`} hier</span>
                  </span>
                </div>
              </div>
            `;
          });
        } else {
          html = `<p class="dashboard-ranking-empty">${rankingByProject ? 'Aucun projet' : 'Aucune ligne'} saisi(e) pour cette date.</p>`;
        }

        rankingEl.innerHTML = html;
      }

      function calculateHoursEfficiency(producedHours, presenceHours) {
        const produced = Number(producedHours);
        const presence = Number(presenceHours);
        return Number.isFinite(produced) && Number.isFinite(presence) && produced >= 0 && presence > 0
          ? (produced / presence) * 100
          : 0;
      }

      function getCraHours(date) {
        return craProjectHours.find((item) => item.project_id === 'cra-wpa' && item.entry_date === date) || null;
      }

      function openCraHoursEditor() {
        if (currentUser?.role !== 'superadmin') return;
        const date = dashboardSelectedDate || getTodayKey();
        const hours = getCraHours(date);
        document.getElementById('craHoursDate').value = date;
        document.getElementById('craHoursDateLabel').textContent = formatDateLabel(date);
        document.getElementById('craProducedHours').value = hours?.produced_hours ?? '';
        document.getElementById('craPresenceHours').value = hours?.presence_hours ?? '';
        document.getElementById('craHoursError').textContent = craHoursLoadError;
        updateCraEfficiencyPreview();
        document.getElementById('craHoursDialog').showModal();
      }

      function updateCraEfficiencyPreview() {
        const producedInput = document.getElementById('craProducedHours');
        const presenceInput = document.getElementById('craPresenceHours');
        const produced = toNumber(producedInput.value);
        const presence = toNumber(presenceInput.value);
        const valid = producedInput.value !== '' && presenceInput.value !== ''
          && Number.isFinite(produced) && produced >= 0 && Number.isFinite(presence) && presence > 0;
        document.getElementById('craEfficiencyPreview').textContent = valid
          ? `${calculateHoursEfficiency(produced, presence).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} %`
          : '—';
      }

      async function saveCraHours() {
        if (currentUser?.role !== 'superadmin') return;
        const errorEl = document.getElementById('craHoursError');
        const button = document.getElementById('craHoursSave');
        if (button.disabled) return;
        const form = document.getElementById('craHoursForm');
        if (!form.reportValidity()) return;
        const producedHours = toNumber(document.getElementById('craProducedHours').value);
        const presenceHours = toNumber(document.getElementById('craPresenceHours').value);
        const date = document.getElementById('craHoursDate').value;
        const efficiency = calculateHoursEfficiency(producedHours, presenceHours);
        if (!Number.isFinite(producedHours) || producedHours < 0 || !Number.isFinite(presenceHours)
            || presenceHours <= 0 || !Number.isFinite(efficiency) || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
          errorEl.textContent = 'Saisis des heures valides : produites ≥ 0 et présence > 0.';
          return;
        }
        const id = `cra-wpa_${date}`;
        const payload = {
          project_id: 'cra-wpa',
          entry_date: date,
          produced_hours: producedHours,
          presence_hours: presenceHours,
          updated_by: currentUser.id
        };
        button.disabled = true;
        errorEl.textContent = '';
        try {
          if (useFirebase) {
            await db.collection('admin_project_hours').doc(id).set(payload);
          } else {
            demoState.craProjectHours = [...(demoState.craProjectHours || []).filter((item) => item.id !== id), { id, ...payload }];
            saveState();
          }
          craProjectHours = [...craProjectHours.filter((item) => item.id !== id), { id, ...payload }];
          craHoursLoadError = '';
          document.getElementById('craHoursDialog').close();
          renderDashboard();
        } catch (error) {
          errorEl.textContent = error.code === 'permission-denied'
            ? 'Enregistrement refusé : publie les nouvelles règles Firestore et vérifie ton rôle superadmin.'
            : `Impossible d’enregistrer les heures : ${error.message || error}`;
        } finally {
          button.disabled = false;
        }
      }

      async function addManagedLine() {
        const inputEl = document.getElementById('managedLineInput');
        const statusEl = document.getElementById('lineManageStatus');
        const value = String(inputEl?.value || '').trim();
        if (!value) {
          if (statusEl) statusEl.textContent = 'Saisis un nom de ligne.';
          return;
        }

        const currentLines = Array.isArray(appLines) ? appLines : [];
        const editingKey = String(editingManagedLine || '').trim().toLowerCase();
        if (currentLines.some((item) => String(item).trim().toLowerCase() === value.toLowerCase() && String(item).trim().toLowerCase() !== editingKey)) {
          if (statusEl) statusEl.textContent = 'Cette ligne existe déjà.';
          return;
        }

        let nextLines;
        if (editingManagedLine) {
          nextLines = currentLines.map((item) => String(item).trim().toLowerCase() === editingKey ? value : item);
        } else {
          nextLines = [...currentLines, value];
        }

        appLines = [...new Set(nextLines)].sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

        if (!useFirebase) {
          persistOwnedLines(appLines);
          saveState();
        } else {
          if (editingManagedLine) {
            const oldDocId = `${currentUser.id}_${editingManagedLine.toLowerCase().replace(/[^a-z0-9]+/g, '_')}`;
            const newDocId = `${currentUser.id}_${value.toLowerCase().replace(/[^a-z0-9]+/g, '_')}`;
            if (oldDocId !== newDocId) {
              await db.collection('production_lines').doc(oldDocId).delete();
            }
          }
          await db.collection('production_lines').doc(`${currentUser.id}_${value.toLowerCase().replace(/[^a-z0-9]+/g, '_')}`).set({ name: value, user_id: currentUser.id });
        }

        const previousEditingLine = editingManagedLine;
        editingManagedLine = '';
        if (inputEl) inputEl.value = '';
        await refreshDataAndRender();
        navigateTo('admin');
        if (statusEl) statusEl.textContent = previousEditingLine ? `Ligne modifiée: ${value}` : `Ligne ajoutée: ${value}`;

      function getReferenceItemValues() {
        const rows = Array.from(document.querySelectorAll('#entryReferenceRows .reference-item-row'));
        return rows.map((row) => ({

      function updateEfficiencyPreview() {
        const lineEl = document.getElementById('entryLine');
        const effectifEl = document.getElementById('entryEffectif');
        const rfcEl = document.getElementById('entryRfc');
        const efficiencyEl = document.getElementById('entryEfficiency');
        const compareEl = document.getElementById('efficiencyCompareStatus');

        if (!lineEl || !effectifEl || !rfcEl || !efficiencyEl || !compareEl) return;

        const items = getReferenceItemValues();
        let totalQuantity = 0;
        let weightedOutput = 0;
        let linkedCount = 0;
        let missingCount = 0;
        const weightedParts = [];

        items.forEach((item) => {
          if (!item.reference) return;
          const gammeRow = findGammeByReference(item.reference, lineEl.value);
          const gammeTime = gammeRow ? Number(gammeRow.gamme_time) : NaN;
          const quantity = Number(item.quantity || 0);
          totalQuantity += Number.isFinite(quantity) ? quantity : 0;
          if (Number.isFinite(gammeTime)) {
            weightedOutput += quantity * gammeTime;
            linkedCount += 1;
            weightedParts.push(`${gammeTime.toFixed(3)} x ${quantity}`);
          } else {
            missingCount += 1;
          }
        });

        const effectif = Number(effectifEl.value);
        const rfc = Number(rfcEl.value);
        const efficiency = effectif > 0 ? (weightedOutput / (effectif * WORKING_HOURS)) * 100 : 0;

        efficiencyEl.value = `${efficiency.toFixed(2)} %`;

        const ecart = calculateEcart(efficiency, rfc);

        if (ecart < 0) {
          compareEl.className = 'status-chip status-bad';
          compareEl.innerHTML = `<i class="bi bi-x-circle"></i>Écart ${ecart.toFixed(2)}% (Rouge)`;
        } else {
          compareEl.className = 'status-chip status-good';
          compareEl.innerHTML = `<i class="bi bi-check-circle"></i>Écart +${ecart.toFixed(2)}% (Vert)`;
        }
      }

      async function saveEfficiencyEntry() {
        const line = document.getElementById('entryLine').value;
        const effectif = Number(document.getElementById('entryEffectif').value);
        const rfc = Number(document.getElementById('entryRfc').value);
        const entryDate = document.getElementById('entryDate').value || getTodayKey();
        const statusEl = document.getElementById('entryStatus');

        const items = getReferenceItemValues().filter((item) => item.reference);
        if (!items.length) {
          statusEl.textContent = 'Ajoute au moins une référence.';
          return;
        }

        if (!effectif || effectif <= 0 || !Number.isFinite(rfc) || rfc < 0) {
          statusEl.textContent = 'Vérifiez les valeurs Effectif, Quantité et RFC.';
          return;
        }

        let totalQuantity = 0;
        let weightedOutput = 0;
        const itemDetails = [];
        for (const item of items) {
          if (!Number.isFinite(item.quantity) || item.quantity < 0) {
            statusEl.textContent = 'Chaque quantité produite doit être valide.';
            return;
          }
          const gammeRow = findGammeByReference(item.reference, line);
          if (!gammeRow) {
            statusEl.textContent = `Référence introuvable ou suffixe à 4 chiffres ambigu: ${item.reference}. Saisis la référence complète.`;
            return;
          }
          const gammeTime = Number(gammeRow.gamme_time);
          totalQuantity += item.quantity;
          weightedOutput += item.quantity * gammeTime;
          itemDetails.push({
            reference: item.reference,
            quantity: item.quantity,
            gamme_time: gammeTime
          });
        }

        const gammeTime = totalQuantity > 0 ? weightedOutput / totalQuantity : 0;
        const efficiency = effectif > 0 ? (weightedOutput / (effectif * WORKING_HOURS)) * 100 : 0;
        const ecart = calculateEcart(efficiency, rfc);

        const payload = {
          user_id: currentUser.id,
          line,
          reference: itemDetails.map((item) => item.reference).join(', '),
          effectif,
          quantity: totalQuantity,
          gamme_time: gammeTime,
          reference_items: itemDetails,
          weighted_output: Number(weightedOutput.toFixed(4)),
          rfc,
          working_hours: WORKING_HOURS,
          efficiency,
          ecart,
          entry_date: entryDate,
          created_at: new Date().toISOString()
        };

        if (!useFirebase) {
          demoState.entries.push({ id: `e${Date.now()}`, ...payload });
          saveState();
        } else {
          await db.collection('entries').add(payload);
        }

        await refreshDataAndRender();
        navigateTo('add-data');
        const refreshedStatus = document.getElementById('entryStatus');
        if (refreshedStatus) {
          refreshedStatus.textContent = `Saisie enregistrée. Efficience: ${efficiency.toFixed(2)} %`;
        }
      }

      async function importGammePreview() {
        const statusEl = document.getElementById('gammeImportStatus');
        const fileInput = document.getElementById('gammeFile');
        const file = fileInput && fileInput.files && fileInput.files[0];
        pendingGammes = [];
        if (!file) {
          if (statusEl) statusEl.textContent = 'Sélectionne un fichier Excel avant de cliquer sur Importer.';
          return;
        }

        if (typeof XLSX === 'undefined') {
          if (statusEl) statusEl.textContent = 'Librairie Excel non chargée.';
          return;
        }

        try {
          const buffer = await file.arrayBuffer();
          const workbook = XLSX.read(buffer, { type: 'array' });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

          if (!rows.length) {
            if (statusEl) statusEl.textContent = 'Fichier vide.';
            return;
          }

          const headerRowIndex = rows.slice(0, 10).findIndex((row) => {
            const headers = row.map((header) => normalizeHeader(header));
            return headers.some((h) => ['reference', 'ref', 'article'].includes(h))
              && headers.some((h) => ['tg', 'tempsdegamme', 'gamme', 'tempsgamme', 'cycle', 'cycletime'].includes(h));
          });

          let refIndex = 0;
          let gammeIndex = 1;
          let lineIndex = -1;
          let dataStartIndex = 0;
          let columnDescription = 'colonnes A (Reference) et B (TG / Temps de gamme)';

          if (headerRowIndex !== -1) {
            const headers = rows[headerRowIndex].map((header) => normalizeHeader(header));
            refIndex = headers.findIndex((h) => ['reference', 'ref', 'article'].includes(h));
            lineIndex = headers.findIndex((h) => ['ligne', 'line', 'lignes'].includes(h));
            gammeIndex = headers.findIndex((h) => ['tg', 'tempsdegamme', 'gamme', 'tempsgamme', 'cycle', 'cycletime'].includes(h));
            dataStartIndex = headerRowIndex + 1;
            columnDescription = `colonnes ${XLSX.utils.encode_col(refIndex)} (${rows[headerRowIndex][refIndex]}) et ${XLSX.utils.encode_col(gammeIndex)} (${rows[headerRowIndex][gammeIndex]})`;
          }

          const imported = rows.slice(dataStartIndex)
            .map((row) => {
              const reference = String(row[refIndex] || '').trim();
              const gammeTime = toNumber(row[gammeIndex]);
              const line = String(row[lineIndex] || 'Ligne 1').trim() || 'Ligne 1';
              if (!reference || !Number.isFinite(gammeTime) || gammeTime <= 0) return null;
              return { line, reference, gamme_time: gammeTime, user_id: currentUser.id };
            })
            .filter(Boolean);

          if (!imported.length) {
            if (statusEl) statusEl.textContent = `Aucune ligne valide trouvée dans ${columnDescription}. Vérifie que chaque référence est renseignée et que le temps de gamme est un nombre supérieur à 0.`;
            return;
          }

          pendingGammes = imported;
          const importedLines = imported.map((item) => String(item.line || '').trim()).filter(Boolean);
          appLines = [...new Set([...(Array.isArray(appLines) ? appLines : []), ...importedLines])].sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
          if (!useFirebase) {
            persistOwnedLines(appLines);
            saveState();
          }
          if (statusEl) statusEl.textContent = `${imported.length} référence(s) prêtes. Cliquez sur Enregistrer.`;
        } catch (error) {
          if (statusEl) statusEl.textContent = `Erreur import: ${error.message}`;
        }
      }

      async function saveImportedGammes() {
        const statusEl = document.getElementById('gammeImportStatus');
        if (!pendingGammes.length) {
          if (statusEl) statusEl.textContent = 'Aucune donnée importée. Cliquez d\'abord sur Importer.';
          return;
        }

        const saveButton = document.querySelector('#adminContent button[onclick="saveImportedGammes()"]');
        const savedCount = pendingGammes.length;
        if (saveButton) saveButton.disabled = true;

        try {
          if (!useFirebase) {
            const merged = new Map((demoState.gammes || []).map((item) => [buildOwnedGammeKey(item.user_id, item.line, item.reference), item]));
            pendingGammes.forEach((item) => {
              merged.set(buildOwnedGammeKey(item.user_id, item.line, item.reference), {
                id: `g${Date.now()}${Math.random().toString(16).slice(2, 8)}`,
                ...item
              });
            });
            demoState.gammes = Array.from(merged.values());
            const importedLines = pendingGammes.map((item) => String(item.line || '').trim()).filter(Boolean);
            persistOwnedLines([...new Set([...(Array.isArray(appLines) ? appLines : []), ...importedLines])].sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' })));
            saveState();
          } else {
            if (!currentUser?.id) throw new Error('Compte non connecté. Déconnecte-toi puis reconnecte-toi.');

            const writes = pendingGammes.map((item) => {
              const docId = buildOwnedGammeKey(item.user_id, item.line, item.reference).replace(/[^a-z0-9_]/g, '_');
              return db.collection('gammes').doc(docId).set(item, { merge: true });
            });
            await Promise.all(writes);

            const importedLines = [...new Set(pendingGammes.map((item) => String(item.line || '').trim()).filter(Boolean))];
            await Promise.all(importedLines.map((line) => {
              const docId = `${currentUser.id}_${line.toLowerCase().replace(/[^a-z0-9]+/g, '_')}`;
              return db.collection('production_lines').doc(docId).set({ name: line, user_id: currentUser.id });
            }));
          }

          pendingGammes = [];
          await refreshDataAndRender();
          navigateTo('admin');
          const refreshedStatus = document.getElementById('gammeImportStatus');
          if (refreshedStatus) refreshedStatus.textContent = `${savedCount} référence(s) et temps de gamme enregistré(s).`;
        } catch (error) {
          const errorCode = error.code || '';
          const errorMessage = errorCode === 'permission-denied'
            ? 'Enregistrement refusé par Firestore. Publie les règles Firestore du fichier firestore.rules et vérifie que ce compte possède users/{UID} avec son e-mail et le rôle user ou superadmin.'
            : `Erreur d’enregistrement (${errorCode || 'inconnue'}): ${error.message || error}`;
          if (statusEl) statusEl.textContent = errorMessage;
        } finally {
          if (saveButton) saveButton.disabled = false;
        }
      }

      function renderSuperAdmin() {
        const panel = document.getElementById('superAdminPanel');
        if (panel) panel.classList.add('hidden');
      }

      function authenticateDemo(login, password) {
        const normalizedLogin = String(login || '').trim().toLowerCase();
        const account = DEMO_ACCOUNTS.find((item) => item.login.toLowerCase() === normalizedLogin && item.password === password);
        if (!account) return null;
        return { id: account.id, login: account.login, email: account.email, role: account.role };
      }

      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const loginInput = document.getElementById('login').value.trim();
        const password = document.getElementById('password').value;

        if (!useFirebase) {
          const user = authenticateDemo(loginInput, password);
          if (!user) {
            document.getElementById('loginError').textContent = 'Identifiants invalides.';
            return;
          }
          document.getElementById('loginError').textContent = '';
          localStorage.setItem('efficiency-user', JSON.stringify(user));
          loginUser(user);
          return;
        }

        try {
          const result = await auth.signInWithEmailAndPassword(loginInput, password);
          const userDoc = await db.collection('users').doc(result.user.uid).get();
          const userData = userDoc.exists ? userDoc.data() : { role: 'user' };
          const user = { id: result.user.uid, login: result.user.email, email: result.user.email, role: userData.role || 'user' };
          document.getElementById('loginError').textContent = '';
          localStorage.setItem('efficiency-user', JSON.stringify(user));
          loginUser(user);
        } catch (error) {
          document.getElementById('loginError').textContent = error.message;
        }
      });

      window.addEventListener('DOMContentLoaded', () => {
        loadState();
        initFirebaseIfPossible();
        navigationCollapsed = true;
        localStorage.setItem('efficiency_nav_collapsed', '1');
        const savedUser = localStorage.getItem('efficiency-user');
        if (savedUser) {
          currentUser = JSON.parse(savedUser);
          setAuthArea();
          showApp();
        } else {
          setAuthArea();
          showLogin();
        }
      });
    </script>
  </body>
</html>
